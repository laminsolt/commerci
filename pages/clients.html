<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../styles/general.css" />
    <link rel="stylesheet" href="../styles/clients.css" />
    <link rel="stylesheet" href="../components/sidebar.css" />
  </head>
  <body>
    <div class="app">
      <div id="sidebar-mount"></div>

      <div class="page">
        <header class="topbar">
          <div class="topbar-left">
            <h1 class="page-title">Clients</h1>
            <span class="breadcrumb">Home &bull; Clients</span>
          </div>
          <div class="topbar-right">
            <button class="icon-btn" aria-label="Search">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
              </svg>
            </button>

            <button class="icon-btn" aria-label="Notifications">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
            </button>

            <button
              class="icon-btn theme-toggle"
              id="themeToggle"
              aria-label="Toggle theme"
            >
              <svg
                class="sun-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="5" />
                <path
                  d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l-1.42 1.42"
                />
              </svg>
              <svg
                class="moon-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </button>
          </div>
        </header>
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="search-wrap">
              <input
                id="searchInput"
                type="text"
                placeholder="Search clients…"
                autocomplete="off"
              />
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </div>
            <div class="filter-wrap">
              <button class="btn btn-outline" id="filterBtn">
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polygon
                    points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"
                  />
                </svg>
                FILTERS
                <span id="filterCountBadge" style="display: none"></span>
              </button>

              <div class="filter-popup" id="filterPopup">
                <div class="filter-popup-header">
                  <span class="filter-popup-title">Filter by Status</span>
                  <button class="filter-reset">Clear all</button>
                </div>

                <div class="filter-group-label">Status</div>

                <label class="filter-option">
                  <input type="checkbox" value="Active" />
                  <span class="filter-dot active"></span> Active
                  <span class="filter-count" id="countActive"></span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="Inactive" />
                  <span class="filter-dot inactive"></span> Inactive
                  <span class="filter-count" id="countInactive"></span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="Lead" />
                  <span class="filter-dot lead"></span> Lead
                  <span class="filter-count" id="countLead"></span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="Pending" />
                  <span class="filter-dot pending"></span> Pending
                  <span class="filter-count" id="countPending"></span>
                </label>

                <button class="btn btn-primary filter-apply">
                  Apply Filters
                </button>
              </div>
            </div>
          </div>

          <button class="btn btn-primary" id="newClientBtn">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            New Client
          </button>
        </div>

        <main>
          <div class="card">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Status</th>
                  <th style="width: 88px">Actions</th>
                </tr>
              </thead>
              <tbody id="clientsTableBody"></tbody>
            </table>
            <div class="table-footer" id="tableFooter"></div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="../script/clients.js"></script>
    <script src="../components/sidebar.js"></script>
  </body>
</html>
