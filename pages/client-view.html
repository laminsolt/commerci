<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../styles/general.css" />
    <link rel="stylesheet" href="../styles/client-view.css" />
    <link rel="stylesheet" href="../components/sidebar.css" />
  </head>
  <body>
    <div class="app">
      <div id="sidebar-mount"></div>

      <div class="page">
        <header class="topbar">
          <div class="topbar-left">
            <h1 class="page-title">Client View</h1>
            <span class="breadcrumb"
              >Home &bull; Clients &bull; Client View</span
            >
          </div>
          <div class="topbar-right">
            <button class="icon-btn" aria-label="Search">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
              </svg>
            </button>

            <button class="icon-btn" aria-label="Notifications">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
            </button>

            <button
              class="icon-btn theme-toggle"
              id="themeToggle"
              aria-label="Toggle theme"
            >
              <svg
                class="sun-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="5" />
                <path
                  d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l-1.42 1.42"
                />
              </svg>
              <svg
                class="moon-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </button>
          </div>
        </header>

        <main class="client-view-content">
          <a class="back-link" href="clients.html">&larr; Back to Clients</a>

          <section class="client-profile card">
            <div class="client-profile-header">
              <div class="client-avatar" id="clientAvatar">C</div>
              <div>
                <h2 id="clientName">Client</h2>
                <p id="clientCompany">-</p>
              </div>
              <span class="client-status" id="clientStatus">-</span>
            </div>

            <div class="client-details-grid">
              <div><span>Email</span><p id="clientEmail">-</p></div>
              <div><span>Mobile</span><p id="clientMobile">-</p></div>
              <div><span>Office phone</span><p id="clientOfficePhone">-</p></div>
              <div><span>Website</span><p id="clientWebsite">-</p></div>
              <div><span>Address</span><p id="clientAddress">-</p></div>
              <div><span>Location</span><p id="clientLocation">-</p></div>
              <div><span>Language</span><p id="clientLanguage">-</p></div>
              <div><span>Balance</span><p id="clientBalance">-</p></div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
  <script type="module" src="../components/sidebar.js"></script>
  <script type="module" src="../script/client-view.js"></script>
</html>
